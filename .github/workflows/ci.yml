name: Continuous Integration
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    - cron: "0 0 * * 2"
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
  
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies (Linux)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        set -eux
        sudo apt-get update
        sudo apt install -y libmpich12 libmpich-dev build-essential ca-certificates libhdf5-dev pkg-config liblzo2-dev libbz2-dev libblosc-dev
        export HDF5_DIR=/usr/include/hdf5/serial

    - name: Install Dependencies (Darwin)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        set -eux
        brew install mpich hdf5 lzo bzip2 c-blosc pkg-config
        
        # Set environment variables for the build process to find headers/libs
        echo "HDF5_DIR=$(brew --prefix hdf5)" >> $GITHUB_ENV
        echo "LZO_DIR=$(brew --prefix lzo)" >> $GITHUB_ENV
        echo "BZ2_DIR=$(brew --prefix bzip2)" >> $GITHUB_ENV
        echo "TABLES_NO_BLOSC2=1" >> $GITHUB_ENV
        
        # Ensure compiler can find the headers and libraries
        echo "CPATH=$(brew --prefix lzo)/include:$(brew --prefix bzip2)/include" >> $GITHUB_ENV
        echo "LIBRARY_PATH=$(brew --prefix lzo)/lib:$(brew --prefix bzip2)/lib" >> $GITHUB_ENV


    - name: Build and install package
      run: |
        set -eux
        python -m venv .venv
        source .venv/bin/activate
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          pip install "tables<3.10"
        fi
        python -m pip install -e .[dev,docs,mpi]

    - name: pytest (no MPI)
      if: always()
      run: |
        source .venv/bin/activate
        set -eux
        python -m pytest
    
    - name: pytest (MPI)
      if: always()
      run: |
        source .venv/bin/activate
        set -eux
        mpirun -n 2 python -m pytest -m 'mpi'
  test-conda:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.13"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Micromamba
      uses: mamba-org/setup-micromamba@v2.0.5
      with:
        environment-name: cb-env
        create-args: >-
          python=${{ matrix.python }}
          pip
          python-build
          twine
          conda-build
          anaconda-client
        condarc: |
          channel_priority: strict
          channels:
            - conda-forge
            - defaults
            - bioconda
        cache-environment: true
        cache-downloads: true

    - name: Generate Conda metadata
      shell: bash
      id: conda-meta
      run: |
        set -eux
        eval "$(micromamba shell hook --shell=bash)"
        micromamba activate cb-env
        ./gen_meta.py

    - name: Build (Conda)
      shell: bash
      id: conda-build
      run: |
        set -eux
        eval "$(micromamba shell hook --shell=bash)"
        micromamba activate cb-env
        path=$(conda-build . --output)
        conda-build .
        echo "path=$path" >> $GITHUB_OUTPUT
